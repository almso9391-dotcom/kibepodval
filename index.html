document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||running&&!b.closest('#sheet')) return; const c=club(),d=b.dataset;
  if(d.t){tab=d.t} else if(d.c!==undefined){S.active=+d.c;occ=[]}
  else if(d.buy){const g=GEAR.find(x=>x.id===d.buy);if(S.money>=g.price&&c.gear.length<spot(c).slots){S.money-=g.price;c.gear.push({id:g.id})}}
  else if(d.fix){const n=c.gear.filter(x=>x.broken).length;if(S.money>=n*4000){S.money-=n*4000;c.gear.forEach(x=>x.broken=false)}}
  else if(d.hire){const p=S.cand.splice(+d.hire,1)[0];p.club=S.active;S.staff.push(p)}
  else if(d.fire){S.staff.splice(+d.fire,1);S.rep=Math.max(0,S.rep-1)}
  else if(d.move){const p=S.staff[+d.move];p.club=(p.club+1)%S.clubs.length}
  else if(d.upg){const u=UPG.find(x=>x.id===d.upg);if(S.money>=u.price){S.money-=u.price;c.upg[u.id]=1;if(u.id==='reno'||u.id==='vent')S.rep=Math.min(100,S.rep+3)}}
  else if(d.mkt){const m=MKT.find(x=>x.id===d.mkt);if(S.money>=m.price){S.money-=m.price;S.mkt[m.id]=m.days;if(m.rep)S.rep=Math.min(100,S.rep+m.rep)}}
  else if(d.open){const sp=SPOTS.find(x=>x.id===d.open);if(S.money>=sp.open&&S.rep>=sp.rep){S.money-=sp.open;S.clubs.push({spot:sp.id,name:sp.name.split(',')[0],price:120,gear:[],upg:{},staff:[],des:{wall:'beton',floor:'tile',light:'warm',decor:[]}});S.active=S.clubs.length-1;tab='buy'}}
  else if(d.loan){S.money+=+d.loan;S.debt+=+d.loan}
  else if(d.repay){const x=Math.min(S.debt,Math.max(0,S.money));S.money-=x;S.debt-=x}
  else if(d.brand){const v=$('#brand').value.trim();if(v)S.brand=v.toUpperCase()}
  else if(d.cname){const v=$('#cname').value.trim();if(v)c.name=v}
  else if(d.neon){S.neon=d.neon}
  else if(d.des){const [k,v]=d.des.split(':');c.des[k]=v}
  else if(d.dsel){dSel=dSel===d.dsel?null:d.dsel}
  else if(d.dclear){c.des.decor=[]}
  else if(d.send){sendTop();return}
  else if(d.reset&&!b.closest('#sheet')){sheet('<h2>Начать заново?</h2><p>Весь прогресс сети пропадёт.</p><div class="row"><button class="btn" data-yes="1">Да, заново</button><button class="btn ghost" data-close="1">Отмена</button></div>');$('#sheet').onclick=ev=>{const x=ev.target.closest('button');if(!x)return;if(x.dataset.yes){S=fresh();cands();save();render()}closeSheet()};return}
  else return;
  save(); render();
});
$('#room').addEventListener('click',e=>{const t=e.target.closest('[data-spot]');if(!t||dSel===null)return;const c=club(),si=+t.dataset.spot,it=DECOR.find(x=>x[0]===dSel);
  if(S.money<it[2]||c.des.decor.length>=6)return; c.des.decor=c.des.decor.filter(x=>x[1]!==si); c.des.decor.push([dSel,si]); S.money-=it[2]; dSel=null; save(); render()});
document.addEventListener('input',e=>{if(e.target.id==='price'){club().price=+e.target.value;save();const h=document.querySelector('#panel h3:last-of-type');if(h)h.textContent='Цена часа: '+club().price+' ₽'}});
$('#go').addEventListener('click',()=>{if(!club().gear.length){sheet('<h2>Пустой зал</h2><p>Сначала купи хотя бы один компьютер во вкладке «Закупки».</p><button class="btn" style="width:100%" data-close="1">Понял</button>');$('#sheet').onclick=e=>{if(e.target.closest('[data-close]'))closeSheet()};return}startShift()});
render();
if(S.day===1&&!S.clubs[0].gear.length){sheet('<h2>Твой комп клуб</h2><p>У тебя 150 000 ₽ и подвал Гены. Купи компы, назначь цену часа и жми «Начать смену». Нанимай людей, ставь улучшения, проходи проверки и открывай новые точки — от цоколя у метро до Дубая.</p><p class="note">Прогресс сохраняется на этом устройстве.</p><button class="btn" style="width:100%" data-close="1">Погнали</button>');$('#sheet').onclick=e=>{if(e.target.closest('[data-close]'))closeSheet()}}
}
</script>
</body></html>
